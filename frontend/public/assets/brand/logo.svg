<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 48" width="295" height="48" fill="none" role="img" aria-label="Курсинг Статс — статистика собачьего спорта">
  <!-- Monogram CS in circle -->
  <g transform="translate(1, 4)">
    <circle cx="20" cy="20" r="18.5" stroke="#A9604B" stroke-width="1.2" fill="none"/>
    <text x="20" y="25.5" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="18.5" font-style="italic" text-anchor="middle" font-weight="600" letter-spacing="-0.8">
      <tspan fill="#252320">C</tspan><tspan fill="#A9604B">S</tspan>
    </text>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(48, 0)">
    <!-- Primary line: Курсинг Статс -->
    <text x="0" y="24.5" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="23" font-style="italic">
      <tspan fill="#252320" font-weight="600">Курсинг </tspan>
      <tspan fill="#A9604B" font-weight="600">Статс</tspan>
    </text>

    <!-- Subtitle line: СТАТИСТИКА СОБАЧЬЕГО СПОРТА -->
    <text x="1" y="38" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="6.8" font-weight="600" fill="#7D7569" letter-spacing="2.5">
      СТАТИСТИКА СОБАЧЬЕГО СПОРТА
    </text>
  </g>
</svg>
