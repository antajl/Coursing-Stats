    <script>
      // 1. Очищаем параметр ?_csrb из адресной строки после перезагрузки с cache-bust (для чистого URL)
      (function () {
        try {
          if (location.search.indexOf('_csrb=') !== -1) {
            var u = new URL(location.href);
            u.searchParams.delete('_csrb');
            var cleanUrl = u.pathname + (u.search ? u.search : '') + u.hash;
            history.replaceState(history.state, '', cleanUrl);
          }
        } catch (e) {}

        // 2. Если /assets/*.js не загрузился (MIME/HTML после деплоя) — reload с cache-bust.
        var KEY = 'cs:asset-reload';
        function reloadOnce() {
          // Игнорируем поисковых роботов, чтобы не плодить дубли страниц с параметром ?_csrb
          if (/bot|google|yandex|bing|slurp|crawler|spider|facebookexternalhit|duckduckbot/i.test(navigator.userAgent || '')) return;
          try {
            var now = Date.now();
            var prev = Number(sessionStorage.getItem(KEY) || 0);
            if (prev && now - prev < 15000) return;
            sessionStorage.setItem(KEY, String(now));
          } catch (e1) {}
          try {
            var url = new URL(location.href);
            url.searchParams.set('_csrb', String(Date.now()));
            location.replace(url.href);
          } catch (e2) {
            location.reload();
          }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || t.tagName !== 'SCRIPT') return;
          var src = t.src || '';
          if (src.indexOf('/assets/') !== -1) reloadOnce();
        }, true);
      })();
    </script>
