name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'data/**'
      - 'scripts/**'
      - 'public/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      
      - name: Enable Corepack
        run: corepack enable

      - name: Install root dependencies
        run: yarn install

      - name: Build and package data for Pages
        run: yarn run build-all-data
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify static indexes are non-empty
        run: npx vitest run backend/tests/static-indexes.test.ts backend/tests/publish-gates.test.ts

      - name: Verify parser fixtures
        run: npx vitest run backend/tests/parser-fixtures.test.ts

      - name: Agent Verification
        run: |
          echo "Running agent verification checks..."
          yarn run security:scan
          yarn run data:quick

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: yarn install

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_TURSO_URL: ${{ secrets.VITE_TURSO_URL }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN }}
        run: yarn run build

      - name: Prerender SEO HTML
        run: yarn run prerender-seo

      - name: Copy data to dist
        run: |
          mkdir -p frontend/dist/data/v1
          cp -r data/v1/* frontend/dist/data/v1/

      - name: Verify SEO artifacts
        run: |
          test -f frontend/dist/spa-shell/index.html
          test -f frontend/dist/robots.txt
          test -f frontend/public/sitemap.xml
          grep -q '/event/' frontend/public/sitemap.xml
          test -d frontend/dist/event || test -d frontend/dist/dog
          test -d frontend/dist/shows/exhibition
          test -d frontend/dist/shows/judges
          grep -q '/spa-shell / 301' frontend/dist/_redirects
          grep -q '/404 / 301' frontend/dist/_redirects
          ! grep -qE '/\* /[^ ]+\.html 200' frontend/dist/_redirects

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
