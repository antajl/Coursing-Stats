name: Deploy RKF Tracker Bot to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'rkf-tracker/bot/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Test & Deploy RKF Tracker Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'rkf-tracker/bot/yarn.lock'

      - name: Install bot dependencies
        working-directory: ./rkf-tracker/bot
        run: yarn install --frozen-lockfile

      - name: Type check (TypeScript)
        working-directory: ./rkf-tracker/bot
        run: yarn run build

      - name: Run unit tests
        working-directory: ./rkf-tracker/bot
        run: yarn run test:run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'rkf-tracker/bot'
          command: deploy
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.TRACKER_BOT_TOKEN }}

      - name: Register Telegram Webhook and Commands
        env:
          TRACKER_BOT_TOKEN: ${{ secrets.TRACKER_BOT_TOKEN }}
        run: |
          echo "Registering Webhook on Telegram..."
          curl -s -f -X POST "https://api.telegram.org/bot${TRACKER_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://coursing-stats-tracker-bot.antajltube.workers.dev/webhook","allowed_updates":["message","callback_query"]}' || true
          echo "Registering bot commands on Telegram..."
          curl -s -f -X POST "https://api.telegram.org/bot${TRACKER_BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[{"command":"start","description":"Главное меню"},{"command":"status","description":"Статус мониторинга"},{"command":"apps","description":"Список заявок и документов"},{"command":"ready","description":"Готовые к выдаче дипломы"},{"command":"competitions","description":"Отслеживание состязаний"},{"command":"track","description":"Подписаться на состязание"},{"command":"auth","description":"Привязать токен rkf.online"},{"command":"logout","description":"Сбросить авторизацию"},{"command":"help","description":"Справка и инструкция"}]}' || true
