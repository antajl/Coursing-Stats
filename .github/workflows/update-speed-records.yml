name: Update Speed Records

on:
  schedule:
    # 2 раза в день: 08:00, 20:00 МСК (UTC+3)
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-speed-records:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install Node dependencies
        run: yarn install

      - name: Export speed records from Google Sheets to JSON
        run: npx tsx backend/scripts/speed/export-speed-from-sheets.ts

      - name: Export coursing records from Google Sheets to JSON
        run: npx tsx backend/scripts/speed/export-coursing-from-sheets.ts

      - name: Commit updated data files
        id: commit_data
        run: |
          git config --local user.email "antajl@yandex.ru"
          git config --local user.name "antajl"
          git add data/v1/donino/speed_records.json data/v1/donino/coursing_records.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update speed records from Google Sheets"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy updated records to S3 CDN
        if: steps.commit_data.outputs.has_changes == 'true'
        run: |
          aws s3 cp data/v1/donino/ s3://${{ secrets.S3_BUCKET }}/data/v1/donino/ \
            --recursive \
            --endpoint-url https://storage.yandexcloud.net \
            --acl public-read \
            --cache-control "public, max-age=3600"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
