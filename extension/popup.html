<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoursingStats • Заявки РКФ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-wrap">
    <!-- Header -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">CS</div>
        <div class="brand-text">
          <h1>Заявки РКФ</h1>
          <span class="subtext">CoursingStats Tracker</span>
        </div>
      </div>

      <div class="top-actions">
        <div class="status-badge" id="status-badge" style="display: none;">
          <div class="status-dot" id="status-dot" title="Связь с РКФ Онлайн активна"></div>
          <span id="lbl-time"></span>
        </div>

        <button class="btn-refresh" id="btn-refresh" title="Синхронизировать с РКФ">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
          <span id="btn-refresh-text">Обновить</span>
        </button>

        <button class="btn-icon" id="btn-fullscreen" title="Открыть в отдельной вкладке">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Not Authenticated View -->
    <div class="auth-card" id="auth-card" style="display: none;">
      <div class="auth-icon">🔐</div>
      <h2>Требуется вход в РКФ Онлайн</h2>
      <p>Откройте сайт <strong>rkf.online</strong> и войдите в свой личный кабинет. Расширение автоматически подхватит авторизацию.</p>
      <div class="auth-actions">
        <button class="btn-primary" id="btn-open-rkf">Открыть RKF.Online</button>
        <button class="btn-secondary" id="btn-check-auth">Проверить снова</button>
      </div>
      <div class="manual-token-link">
        <a href="#" id="toggle-manual-token">Ввести токен вручную</a>
      </div>
      <div class="manual-token-wrap" id="manual-token-wrap" style="display: none;">
        <input type="text" id="manual-token-input" placeholder="Bearer токен из заголовка Authorization...">
        <button class="btn-primary" id="btn-save-manual-token">Сохранить</button>
      </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="main-dashboard" style="display: none;">
      <!-- Filter Tabs -->
      <div class="filter-bar">
        <div class="filter-pill active" data-filter="all">Все <span class="count" id="cnt-all">(0)</span></div>
        <div class="filter-pill pill-active" data-filter="active">В обработке <span class="count" id="cnt-active">(0)</span></div>
        <div class="filter-pill pill-pickup" data-filter="to_pickup">Готовы к выдаче <span class="count" id="cnt-pickup">(0)</span></div>
        <div class="filter-pill" data-filter="collected">Забрали <span class="count" id="cnt-collected">(0)</span></div>
        <div class="filter-pill pill-danger" data-filter="rejected" style="display: none;">Отклонено <span class="count" id="cnt-rejected">(0)</span></div>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Поиск по кличке собаки, названию титула или номеру...">
      </div>

      <!-- Applications List -->
      <div class="apps-list" id="apps-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Error Modal -->
    <div class="error-modal-backdrop" id="error-modal" style="display: none;">
      <div class="error-modal">
        <h3 id="err-title">Ошибка связи с РКФ</h3>
        <p id="err-desc"></p>
        <div class="hint" id="err-hint"></div>
        <button class="btn-close" id="btn-close-error">Понятно</button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
